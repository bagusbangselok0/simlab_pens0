services:

  # ─── PHP Application (Laravel) ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simlab-app
    container_name: simlab_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - simlab_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Nginx Web Server ───────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: simlab_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - simlab_network
    depends_on:
      - app

  # ─── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: simlab_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simlab}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - simlab_dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simlab_network

  # ─── Laravel Scheduler ──────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simlab_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    command: php artisan schedule:work
    networks:
      - simlab_network
    depends_on:
      - db

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  simlab_network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  simlab_dbdata:
    driver: local
