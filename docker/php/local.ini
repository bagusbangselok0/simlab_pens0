; ─── PHP Custom Configuration for Laravel ──────────────────────────────────

; Memory
memory_limit = 256M

; Upload settings (untuk upload file/signature)
upload_max_filesize = 20M
post_max_size = 25M

; Execution time
max_execution_time = 120
max_input_time = 120

; Display Errors (nonaktifkan di production)
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Asia/Jakarta

; OPcache (aktifkan untuk performa lebih baik di production)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
